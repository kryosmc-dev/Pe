name: Compilar
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@v4
        with:
          name: MascotasX
          path: target/MascotasX-*.jar
          if-no-files-found: error
