# Mascotas de la tienda (solo mobs con animacion de ataque). page = pagina del menu Comprar, slot = posicion (fila*9+columna).
# attack: melee | arrow | fireball | snowball | spit | potion | wind | fangs   (los de distancia atacan a distancia)
# flying: true = vuela. enabled: false = oculta de la tienda. Todas las mascotas se pueden montar.
#
# Opcionales por mascota:
#   reward-multiplier: 1.0     multiplica el dinero de las recompensas por nivel (por defecto sube con el precio: 0.5 a 2.5)
#   rewards:                   recompensa propia de esta mascota en un nivel (reemplaza a la general de config.yml)
#     25:
#       money: 5000
#       commands: ["give %player% diamond 8"]
#       description: ["8 diamantes"]
#   base-scale: 1.0            tamano propio de esta mascota (1.5 = 50% mas grande; el jugador lo multiplica con su opcion Tamano)
#   sound: "entity.wolf.ambient"   sonido al invocarla y al acariciarla (por defecto, el de su mob)
#   combat:                    ajustes de combate (si falta, se usan los del tipo de ataque)
#     windup: 1000             ms que carga antes de disparar
#     cooldown: 1500           ms entre disparos
#     melee-cooldown: 900      ms entre golpes cuerpo a cuerpo
#     range: 16                alcance de disparo (bloques)
#     detect: 12               radio donde busca enemigos
#     keep-distance: 6         distancia que mantiene al disparar (0 = no retrocede)
#     speed: 0.34              velocidad al perseguir

