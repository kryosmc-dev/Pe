name: MascotasX
version: ${project.version}
main: me.mascotasx.MascotasX
api-version: '1.21.11'
description: Sistema de mascotas que luchan a tu lado, suben de nivel y tienen cosmeticos unicos.
softdepend: [Vault, PlaceholderAPI]
commands:
  mascotas:
    description: Abre el menu de mascotas
    aliases: [pets, mascota]
    usage: /mascotas [comprar|guardar|modo|llamar]
permissions:
  mascotas.use:
    default: true
  mascotas.admin:
    default: op
  mascotas.pet.*:
    description: Permite usar todas las mascotas (solo si permissions.per-pet esta activado)
    default: false
